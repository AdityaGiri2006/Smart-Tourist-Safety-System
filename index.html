<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const titles={dashboard:['Dashboard','Real-time tourist safety overview'],map:['Live Map','India-wide operational map'],tourists:['Tourists & Tracking','Registered tourists and consent-based GPS tracking'],alerts:['Emergency Alerts / SOS','SOS requests and incident alerts'],rescue:['Rescue Operations','Response teams and operational status'],resources:['Emergency Resources','Emergency numbers and device actions'],nearby:['Hospitals / Police / Ambulance','Live mapped emergency facilities near a location'],risk:['Risk Intelligence','Destination risk and alert concentration'],weather:['Live Weather','Current weather from a public meteorological API'],incidents:['Incident Reports','Operational incident records'],audit:['Audit Trail','Traceable actions performed in this browser'],notifications:['Notifications','Open safety alerts'],settings:['Settings','Live room, GPS and device configuration']};
const destinations=[
{id:'delhi',name:'India Gate & Central Delhi',city:'New Delhi',state:'Delhi',lat:28.6129,lon:77.2295,risk:34},{id:'agra',name:'Taj Mahal',city:'Agra',state:'Uttar Pradesh',lat:27.1751,lon:78.0421,risk:28},{id:'jaipur',name:'Jaipur Old City & Amer',city:'Jaipur',state:'Rajasthan',lat:26.9124,lon:75.7873,risk:39},{id:'gwalior',name:'Gwalior Fort',city:'Gwalior',state:'Madhya Pradesh',lat:26.2298,lon:78.1734,risk:31},{id:'rishikesh',name:'Rishikesh Riverfront',city:'Rishikesh',state:'Uttarakhand',lat:30.0869,lon:78.2676,risk:56},{id:'manali',name:'Solang Valley, Manali',city:'Manali',state:'Himachal Pradesh',lat:32.3166,lon:77.1725,risk:62},{id:'goa',name:'Baga-Calangute Coast',city:'Calangute',state:'Goa',lat:15.5557,lon:73.7517,risk:48},{id:'mumbai',name:'Gateway of India',city:'Mumbai',state:'Maharashtra',lat:18.9220,lon:72.8347,risk:35},{id:'hampi',name:'Hampi Heritage Zone',city:'Hampi',state:'Karnataka',lat:15.3350,lon:76.4600,risk:41},{id:'chennai',name:'Marina Beach',city:'Chennai',state:'Tamil Nadu',lat:13.0500,lon:80.2824,risk:44},{id:'kolkata',name:'Victoria Memorial',city:'Kolkata',state:'West Bengal',lat:22.5448,lon:88.3426,risk:32},{id:'srinagar',name:'Dal Lake',city:'Srinagar',state:'Jammu & Kashmir',lat:34.0837,lon:74.7973,risk:51},{id:'kochi',name:'Fort Kochi',city:'Kochi',state:'Kerala',lat:9.9658,lon:76.2421,risk:29},{id:'puri',name:'Puri Beach & Jagannath',city:'Puri',state:'Odisha',lat:19.8135,lon:85.8312,risk:46},{id:'gangtok',name:'Gangtok',city:'Gangtok',state:'Sikkim',lat:27.3389,lon:88.6065,risk:43},{id:'vizag',name:'Visakhapatnam Coast',city:'Visakhapatnam',state:'Andhra Pradesh',lat:17.6868,lon:83.2185,risk:38},{id:'hyderabad',name:'Charminar',city:'Hyderabad',state:'Telangana',lat:17.3616,lon:78.4747,risk:30},{id:'amritsar',name:'Golden Temple',city:'Amritsar',state:'Punjab',lat:31.6200,lon:74.8765,risk:27}
];
let tourists=load('st_tourists',[]);
let alerts=load('st_alerts',[]);
let incidents=load('st_incidents',[]);
let auditRows=load('st_audit',[]),dispatchLog=load('st_dispatch',[]),teams=load('st_teams',[]);
let page='dashboard',map=null,mapMarkers=[],watchId=null,trackingId=null,lastGps=null,nearbyCoords=null,nearbyResults=[],toastTimer=null;
let livePeer=null, livePeerId='', liveConnections=new Set(), liveRole='admin', liveRoomReady=false, liveLastBroadcast=0, liveRoomCode='', touristRegisterTimer=null, touristReconnectTimer=null;

/* ===== FIREBASE REAL BACKEND CONFIG =====
   Replace these values once with your Firebase web-app config.
   Enable Realtime Database + Anonymous Authentication in Firebase Console.
   The same hosted index.html then works from desktop and tourist phones. */
const SMARTTOUR_FIREBASE_CONFIG={
  apiKey:'AIzaSyD8oClYSmeTl6mVKAve8RJO8Cx1pMc-PeM',
  authDomain:'smarttour-india-25490.firebaseapp.com',
  databaseURL:'https://smarttour-india-25490-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'smarttour-india-25490',
  appId:'1:15163859587:web:6156b618092a655c5071b6'
};
let fb={ready:false,db:null,auth:null,api:null,unsubs:[]}, backendMode='local';
let firebaseInitPromise=null;
function firebaseConfigured(){return SMARTTOUR_FIREBASE_CONFIG.apiKey&&!SMARTTOUR_FIREBASE_CONFIG.apiKey.startsWith('PASTE_')&&SMARTTOUR_FIREBASE_CONFIG.databaseURL&&!SMARTTOUR_FIREBASE_CONFIG.databaseURL.includes('PASTE_')}
async function initFirebaseBackend(){
  if(!firebaseConfigured()){backendMode='local';setLivePill('SETUP FIREBASE');return false}
  try{
    const appMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const dbMod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');
    const app=appMod.initializeApp(SMARTTOUR_FIREBASE_CONFIG);
    const auth=authMod.getAuth(app);
    await authMod.signInAnonymously(auth);
    const db=dbMod.getDatabase(app);
    fb={ready:true,db,auth,api:{...dbMod},unsubs:[]}; backendMode='firebase'; setLivePill('FIREBASE LIVE');
    const watch=(path,fn)=>{const u=dbMod.onValue(dbMod.ref(db,path),snap=>fn(snap.val()));fb.unsubs.push(u)};
    watch('tourists',v=>{tourists=v?Object.values(v):[];save('st_tourists',tourists);refreshCurrentPage()});
    watch('alerts',v=>{alerts=v?Object.values(v):[];save('st_alerts',alerts);refreshCurrentPage()});
    watch('incidents',v=>{incidents=v?Object.values(v):[];save('st_incidents',incidents);if(page==='incidents')incidentsPage()});
    watch('teams',v=>{teams=v?Object.values(v):[];save('st_teams',teams);if(page==='rescue'||page==='dashboard')refreshCurrentPage()});
    return true;
  }catch(e){console.error('Firebase init failed',e);backendMode='local';setLivePill('FIREBASE ERROR');return false}
}
async function waitForFirebase(timeoutMs=12000){
  if(fb.ready)return true;
  if(firebaseInitPromise){try{await Promise.race([firebaseInitPromise,new Promise(r=>setTimeout(()=>r(false),timeoutMs))]);}catch(e){}}
  return fb.ready;
}
function safeKey(x){return String(x).replace(/[.#$\[\]\/]/g,'_')}
async function cloudSet(path,value){if(!fb.ready)return false;try{await fb.api.set(fb.api.ref(fb.db,path),value);return true}catch(e){console.error(e);return false}}
async function cloudRemove(path){if(!fb.ready)return false;try{await fb.api.remove(fb.api.ref(fb.db,path));return true}catch(e){console.error(e);return false}}
async function cloudAudit(row){if(!fb.ready)return;try{const r=fb.api.push(fb.api.ref(fb.db,'audit'));await fb.api.set(r,row)}catch(e){}}

function load(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function audit(action,entity,id,detail){const row={time:Date.now(),action,entity,id,detail};auditRows.unshift(row);auditRows=auditRows.slice(0,250);save('st_audit',auditRows);cloudAudit(row)}
function toast(s){clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').style.display='block';toastTimer=setTimeout(()=>$('#toast').style.display='none',4200)}
function dn(id){return destinations.find(d=>d.id===id)?.name||id||'—'}
function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function jsq(x){return String(x??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
function badge(x){return `<span class="badge ${esc(String(x).toLowerCase())}">${esc(x)}</span>`}
function ago(t){if(!t)return 'No location';let s=Math.max(0,Math.floor((Date.now()-t)/1000));if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago'}
function dkm(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function destSelect(id,selected){return `<select id="${id}">${destinations.map(d=>`<option value="${d.id}" ${d.id===selected?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`}

async function go(p){page=p;navRender();$('#app').innerHTML=`<div class="panel"><div class="pad"><b>Opening ${esc(titles[p][0])}…</b></div></div>`;try{await pages[p]()}catch(e){console.error(e);$('#app').innerHTML=`<div class="panel"><div class="pad"><b>${esc(titles[p][0])}</b><p class="note">This section is available. A recoverable display error occurred, so the page was kept operational.</p><button class="btn primary" onclick="go('${p}')">Reload section</button></div></div>`}}

function dashboardPage(){let active=alerts.filter(a=>a.status!=='resolved').length,openRes=teams.filter(t=>t.status!=='available').length,risks=destinations.filter(d=>d.risk>=50).length,avg='—';let seen=tourists.filter(t=>t.lastSeen).map(t=>Date.now()-t.lastSeen);if(seen.length)avg=Math.max(0,Math.round(seen.reduce((a,b)=>a+b,0)/seen.length/60000))+' min';$('#app').innerHTML=`
<div class="hero"><div class="heroRow"><div><h2>SmartTour India — Safety Command Center</h2><p>Tourist welfare monitoring, emergency alerts, location tracking, rescue operations and live public safety data for Indian destinations.</p></div><div class="heroKpi"><b>${tourists.length}</b><span class="muted">Registered Tourists</span></div></div></div>

<div class="panel"><div class="head"><div><h3>Risk Analytics</h3><small>Configured destination risk index</small></div><button class="btn" onclick="go('risk')">Analyze</button></div><div class="pad">${destinations.filter(d=>d.risk>=50).slice(0,3).map(d=>`<div style="margin-bottom:9px"><div class="itemTop"><small>${esc(d.name)}</small><b>${d.risk}</b></div><div class="progress"><i style="width:${d.risk}%"></i></div></div>`).join('')}</div></div>

<div class="footer">Public data sources are labeled. Live GPS requires tourist permission. When Firebase is configured, registrations, GPS and alerts persist cross-device; official emergency dispatch still requires authorized government integration.</div>`;setTimeout(()=>buildMap('dashMap',true),80)}
function baseMap(id){if(!window.L)return null;let m=L.map(id,{zoomControl:true,preferCanvas:true}).setView([22.9734,78.6569],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(m);return m}
function clearMarkers(){mapMarkers.forEach(x=>{try{x.remove()}catch(e){}});mapMarkers=[]}
function marker(m,lat,lon,text){let x=L.marker([lat,lon]).addTo(m).bindPopup(text);mapMarkers.push(x);return x}
function buildMap(id,small=false){if(!window.L)return;let m=baseMap(id);if(!m)return;if(!small){map=m;window._liveTouristMarkers=new Map()}let colors={tourist:'#22c7ad',sos:'#ff5c68',team:'#7fb0ff',dest:'#f7c55d'};destinations.forEach(d=>{let c=L.circleMarker([d.lat,d.lon],{radius:5,color:colors.dest,fillColor:colors.dest,fillOpacity:.7}).addTo(m).bindPopup(`<b>${esc(d.name)}</b><br>Risk index: ${d.risk}`);mapMarkers.push(c)});tourists.forEach(t=>{if(t.lat==null||t.lon==null)return;let c=t.status==='sos'?colors.sos:colors.tourist;let mk=marker(m,t.lat,t.lon,`<b>${esc(t.name)}</b><br>${esc(t.id)}<br>Status: ${esc(t.status)}<br>Last GPS: ${ago(t.lastSeen)}<br><button onclick="startSpecificGPS('${jsq(t.id)}')">Track this tourist</button>`);if(!small&&window._liveTouristMarkers)window._liveTouristMarkers.set('tourist:'+t.id,mk)});teams.forEach(t=>{marker(m,t.lat,t.lon,`<b>${esc(t.name)}</b><br>${esc(t.status)}<br>${esc(t.base)}`)});alerts.filter(a=>a.status!=='resolved').forEach(a=>{let t=tourists.find(x=>x.id===a.tourist_id);if(t?.lat!=null)marker(m,t.lat,t.lon,`<b>SOS / Alert #${a.id}</b><br>${esc(t.name)}<br>${esc(a.message)}`)});return m}
function mapPage(){stopTrackingIfLeavingMap(false);$('#app').innerHTML=`<div class="panel"><div class="head"><div><h3>Live India Map</h3><small>Zoom, pan, locate device, monitor registered tourist coordinates</small></div><div class="toolbar"><button class="btn" onclick="fitIndia()">India View</button><button class="btn" onclick="locateMe()">My GPS</button><button class="btn primary" onclick="startTrackingPrompt()">Start Tourist GPS</button><button class="btn danger" onclick="stopTracking()">Stop Tracking</button></div></div><div class="mapWrap"><div id="fullMap" class="map mapLarge"></div><div class="mapLegend"><span class="dot" style="background:#22c7ad"></span>Tourist &nbsp; <span class="dot" style="background:#ff5c68"></span>SOS &nbsp; <span class="dot" style="background:#7fb0ff"></span>Response &nbsp; <span class="dot" style="background:#f7c55d"></span>Destination</div></div></div><div class="panel"><div class="pad"><div id="gpsBanner" class="liveTrack"><span class="pulse"></span><b>GPS ready · waiting for device location</b></div><div class="liveTrack"><span class="pulse"></span><div><b id="trackTitle">GPS status</b><div id="trackInfo" class="note">Select a registered tourist and press Start Tourist GPS. The browser will ask for Location permission when required.</div></div></div></div></div>`;setTimeout(()=>{map=buildMap('fullMap');if(lastGps)showGpsOnMap(lastGps.lat,lastGps.lon)},80)}
function fitIndia(){if(map)map.setView([22.9734,78.6569],5)}
function locateMe(){requestGpsOnce(p=>{if(map)showGpsOnMap(p.coords.latitude,p.coords.longitude);setGpsBanner('GPS connected · '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6));toast('Device GPS connected')},e=>setGpsBanner(gpsStatusText(e)))}
function gpsContext(){return {supported:!!navigator.geolocation,secure:window.isSecureContext===true,top:window.top===window.self,permission:'unknown'}}
async function gpsPermissionState(){try{if(navigator.permissions){let p=await navigator.permissions.query({name:'geolocation'});return p.state}}catch(e){}return 'unknown'}
function gpsStatusText(e){if(!e)return'Waiting for device location…';if(e.code===1)return'Waiting for browser location permission';if(e.code===2)return'Waiting for a usable device location';if(e.code===3)return'Waiting for a GPS fix';return'Waiting for device location…'}
function requestGpsOnce(ok,fail){if(!navigator.geolocation){if(fail)fail({code:2});return}navigator.geolocation.getCurrentPosition(ok,e=>{if(fail)fail(e);else toast(gpsStatusText(e))},{enableHighAccuracy:true,timeout:30000,maximumAge:0})}
function gpsError(e){return gpsStatusText(e)}
function setGpsBanner(text){let a=$('#gpsBanner');if(a)a.textContent=text}
function showGpsOnMap(lat,lon){lastGps={lat,lon,time:Date.now()};if(map){map.setView([lat,lon],16);let c=L.circleMarker([lat,lon],{radius:9,color:'#22c7ad',fillColor:'#22c7ad',fillOpacity:.9}).addTo(map).bindPopup('<b>Current device GPS</b><br>'+lat.toFixed(6)+', '+lon.toFixed(6)).openPopup();mapMarkers.push(c)}}
function startTrackingPrompt(){if(!tourists.length)return registerTourist();toast('Tourist GPS must be started on the tourist phone. Open/share Tourist Mode link.')}
function startSpecificGPS(id){let t=tourists.find(x=>x.id===id);if(!t){toast('Tourist not found');return}if(!t.consent){toast('Location consent is required before tracking can start');return}if(!navigator.geolocation){setGpsBanner('Device location is not available in this browser');return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);trackingId=id;setGpsBanner('Connecting to device GPS…');watchId=navigator.geolocation.watchPosition(p=>{let x=tourists.find(z=>z.id===id);if(!x)return;let c=p.coords;x.lat=c.latitude;x.lon=c.longitude;x.accuracy=c.accuracy;x.speed=c.speed;x.heading=c.heading;x.lastSeen=Date.now();save('st_tourists',tourists);lastGps={lat:c.latitude,lon:c.longitude,time:Date.now()};audit('GPS_UPDATE','tourist',id,`${c.latitude.toFixed(6)},${c.longitude.toFixed(6)} accuracy=${Math.round(c.accuracy||0)}m`);setGpsBanner(`GPS LIVE · ${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)} · ±${Math.round(c.accuracy||0)}m`);if(page==='map'){showGpsOnMap(c.latitude,c.longitude);let ti=$('#trackInfo'),tt=$('#trackTitle');if(tt)tt.innerHTML=`<span class="ok">● LIVE</span> ${esc(x.name)} · ${esc(x.id)}`;if(ti)ti.textContent=`${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)} · accuracy ±${Math.round(c.accuracy||0)} m · speed ${c.speed==null?'—':(c.speed*3.6).toFixed(1)+' km/h'} · updated ${new Date().toLocaleTimeString()}`}},e=>{setGpsBanner(gpsStatusText(e));if(page==='map'){let ti=$('#trackInfo');if(ti)ti.textContent=gpsStatusText(e)+' · press Start Tourist GPS again after allowing Location in the browser.'}}, {enableHighAccuracy:true,maximumAge:0,timeout:30000});audit('TRACKING_STARTED','tourist',id,'Device GPS watchPosition started');toast(`GPS connection requested for ${t.name}`);if(page==='tourists')touristsPage()}
function stopTracking(){if(watchId!==null)navigator.geolocation?.clearWatch(watchId);if(trackingId)audit('TRACKING_STOPPED','tourist',trackingId,'Device GPS tracking stopped');watchId=null;trackingId=null;setGpsBanner('GPS tracking stopped');toast('GPS tracking stopped')}
function stopTrackingIfLeavingMap(){/* intentionally keep tracking when navigating; GPS belongs to the selected tourist */}
function touristsPage(){let tracking=trackingId?tourists.find(x=>x.id===trackingId):null;$('#app').innerHTML=`<div class="panel"><div class="head"><div><h3>Tourist Registry & Live Tracking</h3><small>Register with mobile number and explicit location consent · device GPS is requested only after a user action</small></div><div class="toolbar"><input id="touristSearch" placeholder="Search name / ID / destination" oninput="filterTourists()"><button class="btn primary" onclick="registerTourist()">+ Register Tourist</button></div></div>${tracking?`<div class="pad"><div class="liveTrack"><span class="pulse"></span><b>LIVE TRACKING: ${esc(tracking.name)}</b><button class="btn danger" style="margin-left:auto" onclick="stopTracking();touristsPage()">Stop</button></div></div>`:''}<div class="tableWrap"><table id="touristTable"><thead><tr><th>Tourist ID</th><th>Tourist / Mobile</th><th>Nationality</th><th>Destination</th><th>Status</th><th>GPS</th><th>Last Seen</th><th>Action</th></tr></thead><tbody>${tourists.map(t=>touristRow(t)).join('')}</tbody></table></div></div><div class="panel"><div class="pad consent"><b>Real GPS rule</b><p class="note">A dashboard cannot silently read another person's phone GPS. The tourist's own device must open the tracking page, provide permission and keep the tracking client active. This single-file version can collect real GPS from the device running it. Cross-device tracking uses Firebase when configured; PeerJS is retained as a live fallback. The tourist must explicitly allow Location on their own phone.</p></div></div>`}
function touristRow(t){let gps=t.lat!=null?`${t.lat.toFixed(5)}, ${t.lon.toFixed(5)}`:'—';return `<tr><td><b>${esc(t.id)}</b></td><td><b>${esc(t.name)}</b><br><span class="phone">${esc(t.phone||'')}</span></td><td>${esc(t.nationality||'—')}</td><td>${esc(dn(t.destination_id))}</td><td>${badge(t.status)}</td><td>${gps}${t.accuracy?`<br><small>±${Math.round(t.accuracy)}m</small>`:''}</td><td>${ago(t.lastSeen)}</td><td><div class="toolbar"><button class="btn primary" onclick="startSpecificGPS('${jsq(t.id)}')">Track GPS</button><button class="btn" onclick="touristDetails('${jsq(t.id)}')">Details</button></div></td></tr>`}
function filterTourists(){let q=($('#touristSearch')?.value||'').toLowerCase();let a=tourists.filter(t=>(t.name+' '+t.id+' '+t.phone+' '+dn(t.destination_id)).toLowerCase().includes(q));$('#touristTable tbody').innerHTML=a.map(t=>touristRow(t)).join('')||'<tr><td colspan="8" class="empty">No matching tourists.</td></tr>'}
function registerTourist(){modal(`<div class="head"><div><h3>Register Tourist</h3><small>Mobile number and location consent are mandatory for tracking</small></div></div><div class="pad fields"><div class="field"><label>Full name</label><input id="rname" placeholder="Tourist name"></div><div class="field"><label>Mobile number</label><input id="rphone" type="tel" placeholder="+91 98XXXXXXXX"></div><div class="field"><label>Nationality</label><input id="rnat" value="Indian"></div><div class="field"><label>Destination</label>${destSelect('rdest','delhi')}</div><div class="field span2"><label>Location consent</label><label class="consent"><input id="rconsent" type="checkbox"> I consent to location collection for safety tracking on this device.</label></div></div><div class="modalFoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTourist()">Register Tourist</button></div>`)}
function saveTourist(){let name=$('#rname').value.trim(),phone=$('#rphone').value.trim(),consent=$('#rconsent').checked;if(!name||!phone){toast('Name and mobile number are required');return}if(!consent){toast('Please confirm location consent before connecting device GPS');return}let id='T-IND-'+String(Math.floor(1000+Math.random()*8999));let t={id,name,phone,nationality:$('#rnat').value||'Indian',destination_id:$('#rdest').value,status:'safe',lat:null,lon:null,lastSeen:null,consent:true,createdAt:Date.now()};tourists.unshift(t);save('st_tourists',tourists);cloudSet('tourists/'+safeKey(id),t);audit('REGISTER','tourist',id,`${name} ${phone}`);closeModal();touristsPage();toast('Tourist registered. GPS must be allowed on the tourist phone.')}
function touristDetails(id){let t=tourists.find(x=>x.id===id);if(!t)return;modal(`<div class="head"><div><h3>${esc(t.name)}</h3><small>${esc(t.id)}</small></div>${badge(t.status)}</div><div class="pad"><div class="statGrid"><div class="stat"><b>${esc(t.phone)}</b><small>Mobile</small></div><div class="stat"><b>${t.lat==null?'—':t.lat.toFixed(6)}</b><small>Latitude</small></div><div class="stat"><b>${t.lon==null?'—':t.lon.toFixed(6)}</b><small>Longitude</small></div></div><p class="note">Last location update: ${ago(t.lastSeen)}. Accuracy: ${t.accuracy?Math.round(t.accuracy)+' m':'—'}. Speed: ${t.speed==null?'—':(t.speed*3.6).toFixed(1)+' km/h'}.</p></div><div class="modalFoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();startSpecificGPS('${jsq(id)}')">Start GPS</button></div>`)}
function alertsPage(){let a=alerts;$('#app').innerHTML=`<div class="panel"><div class="head"><div><h3>Emergency Alerts / SOS</h3><small>Traceable alert records with acknowledgement and resolution</small></div><button class="btn danger" onclick="createSOS()">+ Raise SOS</button></div><div class="tableWrap"><table><thead><tr><th>ID</th><th>Type</th><th>Tourist</th><th>Destination</th><th>Severity</th><th>Status</th><th>Time</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.type)}</td><td>${esc(x.tourist_id||'—')}</td><td>${esc(dn(x.destination_id))}</td><td>${badge(x.severity)}</td><td>${badge(x.status)}</td><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.status!=='resolved'?`<button class="btn" onclick="ackAlert(${x.id})">${x.status==='active'?'Acknowledge':'Resolve'}</button>`:'Resolved'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No alerts.</td></tr>'}</tbody></table></div></div>`}
function createSOS(){let t=tourists.find(x=>x.consent)||tourists[0];if(!t){toast('Register a tourist first');return}let a={id:1000+Math.floor(Math.random()*8999),tourist_id:t.id,type:'SOS',severity:'high',status:'active',destination_id:t.destination_id,message:`SOS raised by ${t.name}. Location: ${t.lat!=null?t.lat.toFixed(6)+', '+t.lon.toFixed(6):'location not yet received'}.`,created_at:Date.now()};alerts.unshift(a);t.status='sos';save('st_alerts',alerts);save('st_tourists',tourists);cloudSet('alerts/'+safeKey(a.id),a);cloudSet('tourists/'+safeKey(t.id),t);audit('SOS_CREATED','alert',a.id,a.message);toast('SOS record created. Use 112 for actual emergency dispatch.');if(page==='alerts')alertsPage()}
function ackAlert(id){let a=alerts.find(x=>x.id===id);if(!a)return;if(a.status==='active')a.status='acknowledged';else a.status='resolved';save('st_alerts',alerts);cloudSet('alerts/'+safeKey(a.id),a);audit('ALERT_STATUS','alert',id,a.status);alertsPage()}
function rescuePage(){let open=alerts.filter(a=>a.status!=='resolved');$('#app').innerHTML=`<div class="panel"><div class="head"><div><h3>Rescue Operations</h3><small>Operational team board — dispatch entries are local records unless a real backend is connected</small></div></div><div class="pad"><div class="actionGrid"><button class="btn danger" onclick="dispatchModal()">Dispatch Team</button><button class="btn" onclick="go('alerts')">Open Alerts</button><a class="btn call" href="tel:112">☎ Call 112</a></div></div></div><div class="grid2"><div class="panel"><div class="head"><h3>Response Teams</h3></div><div class="tableWrap"><table><thead><tr><th>Team</th><th>Base</th><th>Status</th><th>Location</th><th>Action</th></tr></thead><tbody>${teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.base)}</td><td>${badge(t.status)}</td><td>${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}</td><td><button class="btn" onclick="cycleTeam('${jsq(t.id)}')">Update</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="head"><div><h3>Open Rescue Alerts</h3><small>${open.length} open</small></div></div><div class="pad">${open.map(a=>`<div class="item"><div class="itemTop"><b>#${a.id}</b>${badge(a.severity)}</div><small>${esc(a.message)}</small><div class="toolbar" style="margin-top:7px"><button class="btn primary" onclick="dispatchForAlert(${a.id})">Dispatch</button></div></div>`).join('')||'<div class="empty">No open alerts.</div>'}</div></div></div>`}
function cycleTeam(id){let t=teams.find(x=>x.id===id);if(!t)return;let seq=['available','enroute','onsite'];t.status=seq[(seq.indexOf(t.status)+1)%seq.length];save('st_teams',teams);cloudSet('teams/'+safeKey(t.id),t);audit('TEAM_STATUS','team',id,t.status);rescuePage()}
function dispatchModal(alertId){let a=alerts.find(x=>x.id===alertId)||alerts.find(x=>x.status!=='resolved');if(!a){toast('No open alert');return}let avail=teams.filter(t=>t.status==='available');modal(`<div class="head"><div><h3>Dispatch Response Team</h3><small>Alert #${a.id} · ${esc(dn(a.destination_id))}</small></div></div><div class="pad fields"><div class="field span2"><label>Response team</label><select id="teamSel">${avail.map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.base)}</option>`).join('')||'<option value="">No available team</option>'}</select></div><div class="field span2"><label>Operational note</label><textarea id="dispatchNote">Respond to alert #${a.id}. Tourist: ${a.tourist_id||'unknown'}. ${a.message}</textarea></div></div><div class="modalFoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="dispatchNow(${a.id})" ${avail.length?'':'disabled'}>Record Dispatch</button></div>`)}
function dispatchForAlert(id){dispatchModal(id)}
function dispatchNow(alertId){let a=alerts.find(x=>x.id===alertId),id=$('#teamSel').value,t=teams.find(x=>x.id===id);if(!a||!t){toast('No available response team');return}t.status='enroute';let rec={id:'D-'+Date.now(),alert_id:alertId,team_id:id,status:'enroute',created_at:Date.now(),note:$('#dispatchNote').value};dispatchLog.unshift(rec);save('st_dispatch',dispatchLog);save('st_teams',teams);audit('DISPATCH','team',id,`Alert #${alertId}`);closeModal();toast(`${t.name} marked enroute`);rescuePage()}

async function searchNearbyCoords(lat,lon,label){
 let o=$('#nearOut'); if(!o)return;
 lat=Number(lat); lon=Number(lon); if(!Number.isFinite(lat)||!Number.isFinite(lon)){o.innerHTML='<div class="empty">Invalid GPS coordinates. Please retry GPS.</div>';return}
 let km=Number($('#nearRadius')?.value||localStorage.st_radius||10); localStorage.st_radius=String(km); nearbyCoords={lat,lon};
 const loc=$('#nearbyLocation'); if(loc)loc.textContent=`Search center: ${label} · ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
 o.innerHTML='<div class="liveTrack"><span class="pulse"></span><b>Finding nearby hospitals, police & ambulance…</b><div class="note" style="margin-top:5px">Using your exact GPS location. Results will appear as soon as the map service responds.</div></div>';
 $('#nearCount')?.replaceChildren(document.createTextNode('Searching nearby facilities…'));
 const query=`[out:json][timeout:12];nwr(around:${Math.round(km*1000)},${lat},${lon})[amenity~"^(hospital|clinic|police)$"];out center tags;`;
 const ambulance=`[out:json][timeout:12];nwr(around:${Math.round(km*1000)},${lat},${lon})[emergency="ambulance_station"];out center tags;`;
 const hosts=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
 let items=[];
 // One combined Overpass request per mirror, instead of 12 sequential requests. This avoids the old endless-loading behavior.
 for(const host of hosts){
   try{
     const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),11000);
     const body=query+'\n'+ambulance;
     const r=await fetch(host,{method:'POST',body:new URLSearchParams({data:body}),cache:'no-store',headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'},signal:ctrl.signal});
     clearTimeout(timer);
     if(!r.ok)continue;
     const j=await r.json();
     if(Array.isArray(j.elements)){items=j.elements;break;}
   }catch(e){}
 }
 if(items.length){
   items=dedupeFacilities(items).map(x=>{let c=x.center||x,t=x.tags||{};return {...x,lat:Number(c.lat),lon:Number(c.lon),tags:t,dist:dkm(lat,lon,Number(c.lat),Number(c.lon))}})
    .filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon)).sort((a,b)=>a.dist-b.dist).slice(0,80);
   nearbyResults=items; renderNearby(items,label); return;
 }
 // Fast public geocoder fallback. It is intentionally limited to nearby bounding-box searches.
 await fallbackNominatim(lat,lon,label);
}
function nominatimSearchUrl(q,lat,lon,km){
 const d=km/111; const box=`${lon-d},${lat+d},${lon+d},${lat-d}`;
 return `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=20&countrycodes=in&bounded=1&viewbox=${box}&q=${encodeURIComponent(q)}`;
}
async function fallbackNominatim(lat,lon,label){
 let out=$('#nearOut'),items=[]; const km=Number($('#nearRadius')?.value||10);
 // Nominatim is a geocoder, so use a few concrete facility terms inside the GPS bounding box.
 const terms=['hospital','clinic','police station','ambulance station'];
 for(const term of terms){
   try{
    const u=nominatimSearchUrl(term,lat,lon,km);
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),6500);
    const r=await fetch(u,{cache:'no-store',headers:{'Accept':'application/json'}}); clearTimeout(timer);
    if(!r.ok)continue; const j=await r.json();
    items.push(...j.map(x=>({lat:Number(x.lat),lon:Number(x.lon),dist:dkm(lat,lon,Number(x.lat),Number(x.lon)),tags:{name:x.name||x.display_name?.split(',')[0]||term,amenity:term,display:x.display_name,phone:x.extratags?.phone||x.extratags?.['contact:phone']||''}})));
   }catch(e){}
 }
 items=dedupeFacilities(items).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon)).sort((a,b)=>a.dist-b.dist).slice(0,60);
 nearbyResults=items;
 if(items.length){ renderNearby(items,label); return; }
 out.innerHTML=`<div class="empty"><b>No nearby mapped facilities were returned.</b><br><span class="note">Your GPS is working, but the public map service did not return a facility. Try 20 km, or use Search Place.</span><div class="toolbar" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="$('#nearRadius').value='20';searchNearbyCoords(${lat},${lon},'${jsq(label)}')">Search 20 km</button><button class="btn" onclick="searchNamedNearby()">Search Place</button><button class="btn" onclick="openExternalFacilitySearch()">Open Map Search</button></div></div>`;
}

/* ===== REAL-TIME SINGLE-FILE LIVE NETWORK =====
   Uses WebRTC via PeerJS public signaling. No fake "backend offline" mode.
   Admin creates a room; tourist connects from their own phone, grants GPS,
   and sends consented live coordinates directly to the admin dashboard.
*/
function randomRoom(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out='ST-';
  for(let i=0;i<6;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function setLivePill(text='LIVE NETWORK READY'){
  const b=$('#liveRoomBtn'); if(b){b.textContent='● '+text;b.classList.add('primary')}
}
function liveRoomLink(){
  const base=location.href.split('#')[0].split('?')[0];
  return base+'?tourist='+encodeURIComponent(liveRoomId()||'firebase');
}
function liveRoomId(){return liveRoomCode||livePeerId}
function broadcast(msg){
  if(liveRole!=='admin')return;
  liveConnections.forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}});
}
function sendToAdmin(msg){
  if(window.liveAdminConn && window.liveAdminConn.open){try{window.liveAdminConn.send(msg);return true}catch(e){}}
  return false;
}
function attachAdminConn(conn){
  liveConnections.add(conn);
  conn.on('data',data=>handleLiveData(data,conn));
  conn.on('open',()=>{
    try{conn.send({type:'hello',serverTime:Date.now(),room:liveRoomId()});}catch(e){}
    toast('Tourist phone connected · waiting for registration/GPS');
    renderLiveRoomStatus();
  });
  conn.on('close',()=>{liveConnections.delete(conn);renderLiveRoomStatus();});
  conn.on('error',()=>{liveConnections.delete(conn);renderLiveRoomStatus();});
  renderLiveRoomStatus();
}
function handleLiveData(data,conn){
  if(!data||typeof data!=='object')return;
  if(data.type==='delete_tourist'){
    const id=data.id;
    if(!id)return;
    const i=tourists.findIndex(t=>t.id===id);
    if(i>=0){
      const removed=tourists[i];
      tourists.splice(i,1);
      save('st_tourists',tourists); cloudRemove('tourists/'+safeKey(id));
      audit('REMOTE_DELETE','tourist',id,`${removed.name||'Tourist'} · removed by tourist`);
    }
    try{conn.send({type:'delete_ack',id});}catch(e){}
    refreshCurrentPage(); renderLiveRoomStatus(); return;
  }
  if(data.type==='register'){
    const incoming={...(data.tourist||{}),live:true,lastSeen:data.tourist?.lastSeen||Date.now()};
    if(!incoming.id)return;
    let i=tourists.findIndex(t=>t.id===incoming.id);
    if(i<0)tourists.unshift(incoming); else tourists[i]={...tourists[i],...incoming};
    save('st_tourists',tourists); cloudSet('tourists/'+safeKey(incoming.id),tourists.find(t=>t.id===incoming.id)); audit('REMOTE_REGISTER','tourist',incoming.id,`${incoming.name||'Tourist'} · live room`);
    try{conn.send({type:'registered',tourist:tourists.find(t=>t.id===incoming.id)});}catch(e){}
    refreshCurrentPage(); renderLiveRoomStatus(); return;
  }
  if(data.type==='gps'){
    const g=data.gps||{};
    if(data.id==null || g.lat==null || g.lon==null)return;
    let i=tourists.findIndex(t=>t.id===data.id);
    // Never drop a real GPS packet just because registration arrived a moment later.

async function startSpecificGPS(id,force=false){

    const t0=tourists.find(x=>x.id===id);
    if(t0?.lat!=null){toast('Showing latest location received from tourist phone');if(page==='map'&&map)showGpsOnMap(t0.lat,t0.lon)}

    return;
  }

  if(!t.consent){toast('Location consent is required');return}
  if(!navigator.geolocation){setGpsBanner('Location is not supported by this browser');toast('This browser does not support device location');return}
  if(!window.isSecureContext){setGpsBanner('GPS needs HTTPS');toast('Open the HTTPS GitHub Pages link in Chrome/Safari');return}
  if(watchId!==null){try{navigator.geolocation.clearWatch(watchId)}catch(e){}watchId=null}

    await uploadLiveGPS(id,c);
    setGpsBanner(`GPS LIVE · ${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)} · ±${Math.round(c.accuracy||0)}m`);
    const st=$('#touristLiveStatus');if(st)st.innerHTML=`<b class="ok">● GPS LIVE</b><p class="trackLine">${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}</p><div class="note">Accuracy ±${Math.round(c.accuracy||0)} m · ${c.speed==null?'stationary':(c.speed*3.6).toFixed(1)+' km/h'} · updated ${new Date().toLocaleTimeString()}</div>`;
    const pb=$('#gpsPermissionBadge');if(pb){pb.textContent='LOCATION ALLOWED';pb.className='badge safe'}
    if(page==='map')showGpsOnMap(c.latitude,c.longitude);
  };
  const handleError=e=>{
    const code=e?.code;
    let msg=code===1?'Location permission is blocked. Open Chrome → Site settings → Location → Allow, then tap Retry GPS.':code===2?'Phone could not get a precise GPS fix yet. Trying network location…':code===3?'GPS is taking too long. Trying network location…':'Could not get device location. Tap Retry GPS.';
    setGpsBanner(msg);
    const st=$('#touristLiveStatus');if(st)st.innerHTML=`<b class="warnText">⚠ GPS needs attention</b><p class="note">${esc(msg)}</p><p class="note"><b>Android:</b> Settings → Location ON → Chrome → Site settings → Location → Allow. Then tap Retry GPS.</p>`;
    const pb=$('#gpsPermissionBadge');if(pb){pb.textContent=code===1?'LOCATION BLOCKED':'GPS RETRY';pb.className='badge high'}
    // A second, less strict request helps phones whose high-accuracy GPS is slow/indoors.

    }

  navigator.geolocation.getCurrentPosition(handlePosition,handleError,{enableHighAccuracy:true,timeout:25000,maximumAge:0});

  toast('Requesting your phone location… tap Allow if prompted');
  updateTouristPermissionBadge();
}

function settingsPage(){
  const configured=firebaseConfigured();
  $('#app').innerHTML=`<div class="panel"><div class="head"><div><h3>Production Data Backend</h3><small>Firebase Realtime Database + anonymous authentication</small></div>${badge(fb.ready?'live':configured?'configured':'setup required')}</div><div class="pad"><div class="liveTrack"><b>${fb.ready?'🟢 Firebase connected':'⚠ Firebase setup required'}</b><p class="note">For true cross-device storage, replace SMARTTOUR_FIREBASE_CONFIG in this HTML with your Firebase web-app config, enable Realtime Database and Anonymous Authentication, then deploy this same file over HTTPS (for example GitHub Pages / Firebase Hosting).</p><p class="note">Backend mode: ${esc(backendMode)}. WebRTC remains a fast live fallback, but admin entries and tourist GPS are persisted to Firebase when configured.</p></div></div></div><div class="panel"><div class="head"><h3>Real data sources</h3></div><div class="pad note"><p><b>GPS:</b> browser Geolocation API with explicit tourist permission; HTTPS required on phones.</p><p><b>Facilities:</b> live OpenStreetMap / Overpass data near exact GPS.</p><p><b>Weather:</b> live Open-Meteo data for coordinates.</p><p><b>Emergency:</b> 112 uses the phone dialer. Official police/ambulance dispatch APIs require government authorization.</p><p><b>Background limitation:</b> normal mobile browsers may suspend GPS when screen locks or page is closed. Continuous closed-app tracking requires a native app or installed PWA with platform-specific background-location support.</p></div></div>`;
}
async function init(){navRender();firebaseInitPromise=initFirebaseBackend();await firebaseInitPromise;$$('[data-page]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.page);$('#shell').classList.remove('navopen');$('#shade').style.display='none'}));$('#menu').onclick=()=>{$('#shell').classList.add('navopen');$('#shade').style.display='block'};$('#shade').onclick=()=>{$('#shell').classList.remove('navopen');$('#shade').style.display='none'};$('#modalShade').onclick=e=>{if(e.target.id==='modalShade')closeModal()};const qs=new URLSearchParams(location.search);const isTourist=qs.has('tourist');if(isTourist){liveRole='tourist';document.body.classList.add('tourist-mode');await go('dashboard');openTouristMode()}else{initLiveAdmin();await go('dashboard')}}
window.addEventListener('beforeunload',()=>{if(watchId!==null)navigator.geolocation?.clearWatch(watchId)});init();
</script>
</body>
</html>
